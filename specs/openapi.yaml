openapi: 3.1.0
info:
  title: Stacks Base API
  version: 0.3.0
  description: Contrato atual da baseline SolidJS + Go net/http com autenticacao, gestao real de usuarios, auditoria e exportacoes.
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Audit
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check da aplicacao.
      operationId: getHealth
      responses:
        '200':
          description: Aplicacao saudavel.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Cria uma conta de usuario e inicia uma sessao.
      operationId: postAuthRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Autentica um usuario.
      operationId: postAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Usuario autenticado.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoga a sessao atual.
      operationId: postAuthLogout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sessao encerrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Solicita recuperacao de acesso.
      operationId: postAuthForgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Solicitacao aceita.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Redefine a senha usando um token de recuperacao.
      operationId: postAuthResetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Senha redefinida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Altera a senha do usuario autenticado.
      operationId: postAuthChangePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Senha alterada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/me:
    get:
      tags: [Auth]
      summary: Retorna o usuario autenticado.
      operationId: getUsersMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users:
    get:
      tags: [Users]
      summary: Lista usuarios de forma paginada.
      operationId: getUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/UserStatus'
        - $ref: '#/components/parameters/IncludeDeleted'
      responses:
        '200':
          description: Lista de usuarios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Users]
      summary: Cria um usuario administrativo ou membro.
      operationId: postUsers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Usuario criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{userId}:
    get:
      tags: [Users]
      summary: Visualiza um usuario.
      operationId: getUsersById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Usuario encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Users]
      summary: Edita nome, e-mail e papel de um usuario.
      operationId: patchUsersById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Usuario atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Users]
      summary: Exclui definitivamente um usuario.
      operationId: deleteUsersById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Usuario excluido.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{userId}/deactivate:
    post:
      tags: [Users]
      summary: Inativa um usuario.
      operationId: postUsersDeactivate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Usuario inativado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{userId}/reactivate:
    post:
      tags: [Users]
      summary: Reativa um usuario.
      operationId: postUsersReactivate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Usuario reativado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{userId}/soft-delete:
    post:
      tags: [Users]
      summary: Apaga um usuario com soft-delete.
      operationId: postUsersSoftDelete
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Usuario apagado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{userId}/restore:
    post:
      tags: [Users]
      summary: Restaura um usuario apagado.
      operationId: postUsersRestore
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Usuario restaurado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/export.csv:
    get:
      tags: [Users]
      summary: Exporta usuarios em CSV.
      operationId: getUsersExportCsv
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/UserStatus'
        - $ref: '#/components/parameters/IncludeDeleted'
      responses:
        '200':
          description: Exportacao em CSV.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/export.xlsx:
    get:
      tags: [Users]
      summary: Exporta usuarios em XLSX.
      operationId: getUsersExportXlsx
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/UserStatus'
        - $ref: '#/components/parameters/IncludeDeleted'
      responses:
        '200':
          description: Exportacao em XLSX.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/print:
    get:
      tags: [Users]
      summary: Gera um PDF imprimivel dos usuarios.
      operationId: getUsersPrint
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/UserStatus'
        - $ref: '#/components/parameters/IncludeDeleted'
      responses:
        '200':
          description: PDF imprimivel dos usuarios.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/audit-logs:
    get:
      tags: [Audit]
      summary: Lista logs de auditoria de forma paginada.
      operationId: getAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Query'
        - name: action
          in: query
          schema:
            type: string
        - name: resource
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: PASETO
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    Query:
      name: query
      in: query
      schema:
        type: string
    UserRole:
      name: role
      in: query
      schema:
        type: string
        enum: [admin, member]
    UserStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [active, inactive]
    IncludeDeleted:
      name: includeDeleted
      in: query
      schema:
        type: boolean
        default: false
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Requisicao invalida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Nao autenticado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Acesso negado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflito de dados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso nao encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Erro interno previsivel.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 8
        newPassword:
          type: string
          minLength: 8
    UserCreateRequest:
      type: object
      required: [name, email, password, role, status]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [admin, member]
        status:
          type: string
          enum: [active, inactive]
    UserUpdateRequest:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member]
    PaginationMeta:
      type: object
      required: [page, perPage, total, totalPages]
      properties:
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    User:
      type: object
      required: [id, name, email, role, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member]
        status:
          type: string
          enum: [active, inactive]
        deletedAt:
          type: [string, 'null']
          format: date-time
        deletedBy:
          type: [string, 'null']
          format: uuid
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'
    UsersEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    AuthEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accessToken, user]
          properties:
            accessToken:
              type: string
            user:
              $ref: '#/components/schemas/User'
    MessageEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [message]
          properties:
            message:
              type: string
    AuditLog:
      type: object
      required: [id, action, resource, route, method, metadata, createdAt]
      properties:
        id:
          type: string
          format: uuid
        actorUserId:
          type: [string, 'null']
          format: uuid
        actorName:
          type: [string, 'null']
        actorEmail:
          type: [string, 'null']
          format: email
        action:
          type: string
        resource:
          type: string
        resourceId:
          type: [string, 'null']
        route:
          type: string
        method:
          type: string
        ipAddress:
          type: [string, 'null']
        userAgent:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    AuditLogsEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
