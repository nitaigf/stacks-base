services:
  postgres:
    image: postgres:16
    container_name: stacks-base-postgres
    environment:
      POSTGRES_DB: stacks_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d stacks_base']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data: